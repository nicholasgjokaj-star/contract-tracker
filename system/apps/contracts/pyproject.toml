[project]
name = "contracts"
version = "0.1.0"
description = "Contract management: upload, organize, search, and sync contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
    "jinja2>=3.1",
    "pdfplumber>=0.11",
    "pydantic>=2",
]

[project.scripts]
contracts = "contracts.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
