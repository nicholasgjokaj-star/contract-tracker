# Contracts: upload a contract, extract its terms with Claude, then organize, search
# and tag it, mirroring each record to a Notion database and each file to Dropbox.
# forward_port publishes port 8200 as the "contracts" tab, then the app's own console
# script serves the Flask app. State (the SQLite store, stored originals, staging
# records, and the Dropbox/Notion config) lives under data/.apps/contracts, which is
# the runner's DATA_DIR default.
[program:contracts]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/forward_port.py --manifest system/apps/contracts/app.toml --url http://localhost:8200 && contracts"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/contracts-stdout.log
stderr_logfile=/var/log/supervisor/contracts-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
